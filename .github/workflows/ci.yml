name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Apple Silicon runner, matching the dev and benchmark machine.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      # PyTorch wheels are pinned against Python 3.14, so pin it here too.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Hash reference model identity
        id: reference-model
        run: |
          model_lines=$(grep -E '^(MODEL_ID|MODEL_REVISION|MODEL_FILES) = ' tools/reference.py)
          test "$(printf '%s\n' "$model_lines" | wc -l)" -eq 3
          model_hash=$(printf '%s\n' "$model_lines" | shasum -a 256 | cut -d ' ' -f 1)
          echo "hash=$model_hash" >> "$GITHUB_OUTPUT"
      - name: Cache pip downloads and Hugging Face models
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/Library/Caches/pip
            ~/.cache/huggingface
          key: reference-${{ runner.os }}-${{ hashFiles('requirements-reference.txt') }}-${{ steps.reference-model.outputs.hash }}
      - name: Show toolchain
        run: |
          uname -m
          sw_vers -productVersion
          clang++ --version | head -1
          cmake --version | head -1
          python3 --version
      - name: Run all checks (format, Release and ASan/UBSan tests, clang-tidy)
        run: ./tools/check.sh
